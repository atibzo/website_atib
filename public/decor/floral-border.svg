<svg xmlns="http://www.w3.org/2000/svg" width="420" height="260" viewBox="0 0 420 260" fill="none" aria-hidden="true">
  <defs>
    <radialGradient id="rose" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#F0C7C0"/>
      <stop offset="55%" stop-color="#E2A39A"/>
      <stop offset="100%" stop-color="#C97A6E"/>
    </radialGradient>
    <radialGradient id="roseLight" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#FBE6DD"/>
      <stop offset="100%" stop-color="#EBBCAC"/>
    </radialGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#C9C8A8"/>
      <stop offset="100%" stop-color="#9FAE84"/>
    </linearGradient>
  </defs>
  <g opacity="0.95">
    <!-- leaves -->
    <path d="M-10 40 C60 10 120 30 150 80 C100 70 40 70 -10 95 Z" fill="url(#leaf)" opacity="0.8"/>
    <path d="M140 -10 C170 40 150 90 110 120 C120 70 110 30 80 -10 Z" fill="url(#leaf)" opacity="0.7"/>
    <path d="M250 30 C300 20 360 40 410 20 C360 70 300 70 250 60 Z" fill="url(#leaf)" opacity="0.7"/>
    <!-- roses -->
    <g>
      <circle cx="60" cy="50" r="40" fill="url(#rose)"/>
      <circle cx="60" cy="50" r="24" fill="url(#roseLight)"/>
      <circle cx="60" cy="50" r="10" fill="#C97A6E"/>
    </g>
    <g>
      <circle cx="130" cy="90" r="30" fill="url(#roseLight)"/>
      <circle cx="130" cy="90" r="16" fill="url(#rose)"/>
    </g>
    <g>
      <circle cx="180" cy="40" r="22" fill="url(#rose)"/>
      <circle cx="180" cy="40" r="11" fill="url(#roseLight)"/>
    </g>
    <g>
      <circle cx="20" cy="110" r="20" fill="url(#roseLight)"/>
      <circle cx="20" cy="110" r="10" fill="#C97A6E"/>
    </g>
    <!-- small buds -->
    <circle cx="210" cy="95" r="9" fill="#E7C97E" opacity="0.85"/>
    <circle cx="100" cy="130" r="7" fill="#E7C97E" opacity="0.8"/>
  </g>
</svg>
